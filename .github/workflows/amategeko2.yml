name: Generate Quiz Video

on:
  workflow_dispatch:
    inputs:
      q:
        description: 'Question text'
        required: true
        type: string
      a:
        description: 'Option A'
        required: true
        type: string
      b:
        description: 'Option B'
        required: true
        type: string
      c:
        description: 'Option C'
        required: false
        type: string
        default: ''
      d:
        description: 'Option D'
        required: false
        type: string
        default: ''
      x:
        description: 'Question number/ID'
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg and Sharp
        run: |
          sudo apt-get update && sudo apt-get install -y --fix-missing ffmpeg
          npm install sharp

      - name: Generate video
        env:
          INPUT_Q: ${{ github.event.inputs.q }}
          INPUT_A: ${{ github.event.inputs.a }}
          INPUT_B: ${{ github.event.inputs.b }}
          INPUT_C: ${{ github.event.inputs.c }}
          INPUT_D: ${{ github.event.inputs.d }}
          INPUT_X: ${{ github.event.inputs.x }}
        run: |
          TEMP_JS="temp_$(date +%s)_$RANDOM.js"

          cat > "$TEMP_JS" << 'EOF'
          const fs   = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');
          const sharp = require('sharp');

          // ─────────────────────────────────────────────────────────────
          // CONFIGURATION
          // ─────────────────────────────────────────────────────────────

          const TOGGLES = {
            SHOW_QUESTION_PREFIX : true,
            USE_EXTERNAL_AUDIO   : true,
            CONVERT_TO_UPPERCASE : true,
            ENABLE_TEXT_STROKE   : false,
            ENABLE_TEXT_SHADOW   : false,
            SHOW_OPTION_LETTERS  : false,
          };

          const PREFIX_CONFIG = {
            PREFIX_TEXT          : 'Q',
            SEPARATOR            : '.',
            SPACE_AFTER_SEPARATOR: ' ',
            INCLUDE_NUMBER       : true,
            SAME_LINE_AS_QUESTION: true,
          };

          const DURATION_CONFIG = {
            FIXED_DURATION: 5,
            MIN_DURATION  : 5,
            MAX_DURATION  : 5,
          };

          // ── Main text box ─────────────────────────────────────────────
          const TEXT_CONFIG = {
            FONT           : 'roadrules/fonts/popb.ttf',
            FONT_SIZE      : 26,        // used for both render-math AND drawtext fontsize
            FONT_COLOR     : 'black',
            LINE_SPACING   : 20,        // leading BETWEEN lines (pixels)
            LINE_WIDTHS: {
              QUESTION: 40,
              OPTION  : 40,
            },
            PARAGRAPH_MARGINS: {
              BETWEEN_QUESTION_AND_OPTIONS: 1,   // blank lines
              BETWEEN_OPTIONS             : 1,
            },
            ALIGNMENT: {
              MODE        : 'left',
              LEFT_MARGIN : 30,
              RIGHT_MARGIN: 10,
            },
            LABEL: {
              ENABLED     : true,
              COLOR       : 'white',
              BORDER_WIDTH: 20,         // box padding (boxborderw)
              OPACITY     : 1.0,
            },
            STROKE: { COLOR: 'black', WIDTH: 1 },
            SHADOW: { COLOR: 'black@0.5', X: 2, Y: 2 },
            // Where the VERTICAL centre of the main box sits on the canvas.
            // Negative = shift upward from true centre.
            TEXT_Y_OFFSET: -70,
          };

          // ── Directories / encoding ────────────────────────────────────
          const DIR_CONFIG = {
            MUSIC_DIR : 'roadrules/song',
            OUTPUT_DIR: 'roadrule/output2',
            TEMP_DIR  : 'roadrule/temp2',
          };

          const PROCESSING_CONFIG = {
            AUDIO_EXTENSIONS: ['.mp3', '.m4a', '.wav'],
          };

          const FFMPEG_CONFIG = {
            VIDEO_CODEC  : 'libx264',
            AUDIO_CODEC  : 'aac',
            LOGLEVEL     : 'error',
            CRF          : 28,
            PRESET       : 'slow',
            AUDIO_BITRATE: '128k',
            FASTSTART    : true,
            TUNE         : null,
          };

          const INSTAGRAM_CONFIG = {
            TARGET_WIDTH : 720,
            TARGET_HEIGHT: 1280,
            FRAME_RATE   : 30,
            PIXEL_FORMAT : 'yuv420p',
          };

          // ─────────────────────────────────────────────────────────────
          // QUESTION INPUT
          // ─────────────────────────────────────────────────────────────

          const questionObj = {
            id     : process.env.INPUT_X || '1',
            text   : process.env.INPUT_Q || '',
            options: {
              a: process.env.INPUT_A || '',
              b: process.env.INPUT_B || '',
              c: process.env.INPUT_C || '',
              d: process.env.INPUT_D || '',
            },
          };
          const questionNumber = parseInt(process.env.INPUT_X, 10) || 1;

          // ─────────────────────────────────────────────────────────────
          // TEXT HELPERS
          // ─────────────────────────────────────────────────────────────

          function applyTextCase(text) {
            return TOGGLES.CONVERT_TO_UPPERCASE ? String(text).toUpperCase() : String(text);
          }

          function wordWrap(text, maxChars) {
            const words = applyTextCase(text).split(' ');
            const lines = [''];
            for (const word of words) {
              const candidate = (lines[lines.length - 1] + ' ' + word).trim();
              if (candidate.length <= maxChars) {
                lines[lines.length - 1] = candidate;
              } else {
                lines.push(word);
              }
            }
            return lines;
          }

          function wordWrapWithPrefix(prefix, text, maxChars) {
            return wordWrap(applyTextCase(prefix) + applyTextCase(text), maxChars);
          }

          function buildMultilineText(qObj, qNumber) {
            const lines = [];

            // ── Question lines ─────────────────────────────────────────
            let prefixText = '';
            if (TOGGLES.SHOW_QUESTION_PREFIX) {
              prefixText = PREFIX_CONFIG.PREFIX_TEXT;
              if (PREFIX_CONFIG.INCLUDE_NUMBER) prefixText += qNumber;
              prefixText += PREFIX_CONFIG.SEPARATOR + PREFIX_CONFIG.SPACE_AFTER_SEPARATOR;
            }

            const questionLines = (TOGGLES.SHOW_QUESTION_PREFIX && PREFIX_CONFIG.SAME_LINE_AS_QUESTION)
              ? wordWrapWithPrefix(prefixText, qObj.text, TEXT_CONFIG.LINE_WIDTHS.QUESTION)
              : wordWrap(qObj.text, TEXT_CONFIG.LINE_WIDTHS.QUESTION);

            lines.push(...questionLines);

            // blank separator lines between question and options
            for (let i = 0; i < TEXT_CONFIG.PARAGRAPH_MARGINS.BETWEEN_QUESTION_AND_OPTIONS; i++) {
              lines.push('');
            }

            // ── Option lines ───────────────────────────────────────────
            const optionKeys = ['a', 'b', 'c', 'd'];
            optionKeys.forEach((key, idx) => {
              if (!qObj.options[key]) return;
              const label = TOGGLES.SHOW_OPTION_LETTERS ? key.toUpperCase() + '. ' : '';
              lines.push(...wordWrap(label + qObj.options[key], TEXT_CONFIG.LINE_WIDTHS.OPTION));
              // blank separator between options (but not after the last one)
              const remaining = optionKeys.slice(idx + 1);
              if (remaining.some(k => qObj.options[k])) {
                for (let i = 0; i < TEXT_CONFIG.PARAGRAPH_MARGINS.BETWEEN_OPTIONS; i++) {
                  lines.push('');
                }
              }
            });

            return lines.join('\n');
          }

          // ─────────────────────────────────────────────────────────────
          // PRECISE LAYOUT MATH
          //
          // Calculate the y‑coordinate (glyph origin) for the main text.
          // FFmpeg drawtext with boxborderw places the box symmetrically
          // around the text, so the glyph origin = boxTop + borderWidth.
          // ─────────────────────────────────────────────────────────────

          function computeTextY(rawText) {
            const lineCount = rawText.split('\n').length;
            const fs        = TEXT_CONFIG.FONT_SIZE;
            const ls        = TEXT_CONFIG.LINE_SPACING;
            const bw        = TEXT_CONFIG.LABEL.ENABLED ? TEXT_CONFIG.LABEL.BORDER_WIDTH : 0;
            const H         = INSTAGRAM_CONFIG.TARGET_HEIGHT;

            const textBlockH = (lineCount - 1) * ls + fs;
            const boxH       = textBlockH + 2 * bw;
            const boxTop     = Math.round((H - boxH) / 2 + TEXT_CONFIG.TEXT_Y_OFFSET);
            return boxTop + bw;
          }

          // ─────────────────────────────────────────────────────────────
          // FILTER BUILDERS
          // ─────────────────────────────────────────────────────────────

          function escapeFilePath(p) {
            return "'" + p.replace(/'/g, "'\\''") + "'";
          }

          function getXPosition() {
            switch (TEXT_CONFIG.ALIGNMENT.MODE) {
              case 'left' : return TEXT_CONFIG.ALIGNMENT.LEFT_MARGIN;
              case 'right': return `w-${TEXT_CONFIG.ALIGNMENT.RIGHT_MARGIN}-text_w`;
              default     : return '(w-text_w)/2';
            }
          }

          /**
           * Build the drawtext filter for the main question/options box.
           * yPx is a concrete pixel integer — no FFmpeg expression needed.
           */
          function buildMainTextFilter(textFilePath, yPx, duration) {
            const fs = TEXT_CONFIG.FONT_SIZE;
            const ls = TEXT_CONFIG.LINE_SPACING;
            const bw = TEXT_CONFIG.LABEL.BORDER_WIDTH;

            let filter =
              `drawtext=textfile=${escapeFilePath(textFilePath)}` +
              `:x=${getXPosition()}` +
              `:y=${yPx}` +
              `:fontfile=${TEXT_CONFIG.FONT}` +
              `:fontsize=${fs}` +
              `:fontcolor=${TEXT_CONFIG.FONT_COLOR}` +
              `:line_spacing=${ls - fs}`;

            if (TEXT_CONFIG.LABEL.ENABLED) {
              filter +=
                `:box=1` +
                `:boxcolor=${TEXT_CONFIG.LABEL.COLOR}@${TEXT_CONFIG.LABEL.OPACITY}` +
                `:boxborderw=${bw}`;
            }
            if (TOGGLES.ENABLE_TEXT_STROKE && TEXT_CONFIG.STROKE.WIDTH > 0) {
              filter += `:borderw=${TEXT_CONFIG.STROKE.WIDTH}:bordercolor=${TEXT_CONFIG.STROKE.COLOR}`;
            }
            if (TOGGLES.ENABLE_TEXT_SHADOW && !TOGGLES.ENABLE_TEXT_STROKE) {
              filter +=
                `:shadowx=${TEXT_CONFIG.SHADOW.X}` +
                `:shadowy=${TEXT_CONFIG.SHADOW.Y}` +
                `:shadowcolor=${TEXT_CONFIG.SHADOW.COLOR}`;
            }
            filter += `:enable='between(t,0,${duration})'`;
            return filter;
          }

          // ─────────────────────────────────────────────────────────────
          // MISC UTILITIES
          // ─────────────────────────────────────────────────────────────

          function getDuration(filePath) {
            try {
              const result = execSync(
                `ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "${filePath}"`
              ).toString();
              return parseFloat(result) || 10;
            } catch {
              return 10;
            }
          }

          function getEncodingArgs() {
            const args = [
              '-c:v', FFMPEG_CONFIG.VIDEO_CODEC,
              '-crf', String(FFMPEG_CONFIG.CRF),
              '-preset', FFMPEG_CONFIG.PRESET,
              '-r', String(INSTAGRAM_CONFIG.FRAME_RATE),
            ];
            if (FFMPEG_CONFIG.TUNE)       args.push('-tune', FFMPEG_CONFIG.TUNE);
            if (FFMPEG_CONFIG.FASTSTART)  args.push('-movflags', '+faststart');
            return args;
          }

          function getRandomAudio() {
            if (!fs.existsSync(DIR_CONFIG.MUSIC_DIR)) return null;
            const files = fs.readdirSync(DIR_CONFIG.MUSIC_DIR)
              .filter(f => PROCESSING_CONFIG.AUDIO_EXTENSIONS.some(ext => f.endsWith(ext)));
            if (!files.length) return null;
            return path.join(DIR_CONFIG.MUSIC_DIR, files[Math.floor(Math.random() * files.length)]);
          }

          async function downloadRandomImage(destPath) {
            const url = 'https://picsum.photos/1200/2000';
            console.log(`Fetching background image from ${url}`);
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
            const buffer = Buffer.from(await response.arrayBuffer());
            await sharp(buffer)
              .resize(INSTAGRAM_CONFIG.TARGET_WIDTH, INSTAGRAM_CONFIG.TARGET_HEIGHT, {
                fit       : 'contain',
                background: { r: 0, g: 0, b: 0 },
              })
              .jpeg()
              .toFile(destPath);
          }

          // ─────────────────────────────────────────────────────────────
          // MAIN
          // ─────────────────────────────────────────────────────────────

          async function run() {
            if (!questionObj.text) throw new Error('No question text provided');

            // Ensure output directories exist
            for (const dir of [DIR_CONFIG.OUTPUT_DIR, DIR_CONFIG.TEMP_DIR]) {
              if (!fs.existsSync(dir)) fs.mkdirSync(dir, { recursive: true });
            }

            const finalDuration = Math.min(
              Math.max(DURATION_CONFIG.FIXED_DURATION, DURATION_CONFIG.MIN_DURATION),
              DURATION_CONFIG.MAX_DURATION
            );
            console.log(`Video duration: ${finalDuration}s`);

            // ── Background image ──────────────────────────────────────
            const imagePath = path.join(DIR_CONFIG.TEMP_DIR, 'background.jpg');
            await downloadRandomImage(imagePath);

            // ── Build text content ────────────────────────────────────
            const multilineText = buildMultilineText(questionObj, questionNumber);
            console.log('Text to overlay:\n' + multilineText);

            // ── Compute text Y position ──────────────────────────────
            const textY = computeTextY(multilineText);
            console.log(`Text y‑origin: ${textY}px`);

            // ── Write text file for FFmpeg ────────────────────────────
            const safeId       = String(questionObj.id).replace(/[^a-zA-Z0-9]/g, '_');
            const textTempPath = path.join(DIR_CONFIG.TEMP_DIR, `text_${safeId}.txt`);
            fs.writeFileSync(textTempPath, multilineText, 'utf8');

            // ── Build FFmpeg filter chain ─────────────────────────────
            const mainTextFilter = buildMainTextFilter(textTempPath, textY, finalDuration);

            const filterComplex =
              `[0:v]boxblur=5:1,format=${INSTAGRAM_CONFIG.PIXEL_FORMAT}[blurred];` +
              `[blurred]${mainTextFilter}[vout]`;

            // ── Audio ─────────────────────────────────────────────────
            let audioSource = null;
            if (TOGGLES.USE_EXTERNAL_AUDIO) {
              audioSource = getRandomAudio();
              if (audioSource) {
                const dur = getDuration(audioSource);
                console.log(`Audio: ${path.basename(audioSource)} (${dur.toFixed(2)}s)`);
              }
            }

            // ── Assemble FFmpeg command ───────────────────────────────
            const tempFilePath   = path.join(DIR_CONFIG.TEMP_DIR, `temp_${safeId}.mp4`);
            const outputFilename = `quiz_${safeId}_${Date.now()}.mp4`;
            const outputFilePath = path.join(DIR_CONFIG.OUTPUT_DIR, outputFilename);

            const ffmpegArgs = ['-y', '-loglevel', FFMPEG_CONFIG.LOGLEVEL];
            ffmpegArgs.push('-loop', '1', '-i', imagePath);
            if (audioSource) ffmpegArgs.push('-i', audioSource);

            ffmpegArgs.push('-filter_complex', filterComplex, '-map', '[vout]');

            if (audioSource) {
              ffmpegArgs.push('-map', '1:a');
            } else {
              ffmpegArgs.push('-map', '0:a?');
            }

            ffmpegArgs.push(...getEncodingArgs());

            if (audioSource) {
              ffmpegArgs.push('-c:a', FFMPEG_CONFIG.AUDIO_CODEC, '-b:a', FFMPEG_CONFIG.AUDIO_BITRATE);
            } else {
              ffmpegArgs.push('-c:a', 'copy');
            }

            ffmpegArgs.push('-t', String(finalDuration), tempFilePath);

            // ── Run FFmpeg ────────────────────────────────────────────
            console.log('Running FFmpeg...');
            try {
              execSync(`ffmpeg ${ffmpegArgs.map(a => `"${a}"`).join(' ')}`, { stdio: 'inherit' });
            } finally {
              if (fs.existsSync(textTempPath)) fs.unlinkSync(textTempPath);
              if (fs.existsSync(imagePath))    fs.unlinkSync(imagePath);
            }

            if (!fs.existsSync(tempFilePath)) throw new Error('FFmpeg did not produce output');
            fs.renameSync(tempFilePath, outputFilePath);

            const kb = Math.round(fs.statSync(outputFilePath).size / 1024);
            console.log(`SUCCESS: ${outputFilePath} (${kb} KB)`);

            if (process.env.GITHUB_OUTPUT) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `filename=${outputFilename}\n`);
            }
          }

          run()
            .then(() => process.exit(0))
            .catch(err => { console.error(err); process.exit(1); });
          EOF

          node "$TEMP_JS"
          rm -f "$TEMP_JS"

      - name: Commit and push video
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add roadrule/output2/
          git diff --staged --quiet || (git commit -m "Add quiz video" && git push)
